# /etc/nginx/sites-available/board.kritano.com
# Starts as plain HTTP; `certbot --nginx -d board.kritano.com --redirect`
# (run by deploy/install.sh the first time) adds TLS and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name board.kritano.com;

    access_log /var/log/nginx/board.access.log;
    error_log  /var/log/nginx/board.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Board limits each route itself; this is the largest (push export).
    client_max_body_size 16m;

    # Live updates and MCP keep a response open and stream it: no buffering,
    # and long timeouts (the server sends a keep-alive every 20 s).
    location ~ ^/api/boards/[^/]+/events$ {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
