[package]
name = "board"
description = "Board: a planning canvas for client website projects."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
typeset-doc = { path = "../typeset-doc" }
board-model = { path = "../board-model" }
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
serde_path_to_error = "0.1.20"
ulid = "3.0.0"
thiserror = "2.0.21"
tracing = "0.1.44"
toml = "1.2.0"
sha2 = "0.11.1"
hmac = "0.13.0"
base64 = "0.23.1"
anyhow = "1.0.104"
rand = "0.10.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server", "macros"] }
async-stream = "0.3.6"
futures-util = "0.3.34"
schemars = "1"
ttf-parser = "0.25.1"
# Text support only: no system fonts (renders must match on every machine)
# and no raster images (a rendered SVG never loads external content).
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
usvg = { version = "0.49.0", default-features = false, features = ["text", "writer"] }

[dev-dependencies]
http-body-util = "0.1.5"
insta = "1.49.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
